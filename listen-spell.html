<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listen & Spell — Spelling Stars</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f2ff;color:#242044;margin:0}header{background:#6752ce;color:white;padding:28px 20px;text-align:center}main{max-width:760px;margin:25px auto;padding:0 15px}.card{background:white;padding:25px;border-radius:20px;box-shadow:0 4px 18px #2c20501a;margin-bottom:18px}h1{margin:0}button{border:0;border-radius:12px;background:#6752ce;color:white;font-size:1rem;font-weight:bold;padding:13px 17px;cursor:pointer;margin:5px}button.secondary{background:#e8e2ff;color:#403194}input,select,textarea{font:inherit;padding:12px;border:1px solid #bbb4d5;border-radius:10px;width:100%;box-sizing:border-box;margin:8px 0 15px}label{font-weight:bold}.status{min-height:30px;font-weight:bold}.hint{color:#655d7c}.word{background:#f2efff;text-align:center;border-radius:15px;padding:22px;font-size:1.3rem}.stats{display:flex;justify-content:space-around;gap:10px}.stats span{font-weight:bold}section[hidden]{display:none}nav{text-align:center;margin:15px}.missed{overflow-wrap:anywhere}
</style></head><body><header><h1>⭐ Spelling Stars</h1><p>Year 5 • Listen, type, learn!</p></header>
<nav><a href="index.html" style="display:inline-block;background:#e8e2ff;color:#403194;text-decoration:none;border-radius:12px;padding:13px 17px;font-weight:bold;margin:5px">← All games</a><br><a href="letter-builder.html" style="display:inline-block;background:#ffcb58;color:#30214f;text-decoration:none;border-radius:12px;padding:13px 17px;font-weight:bold;margin:5px">🧩 Play Letter Builder</a></nav>
<main><section id="practice" class="card"><h2>🎧 Spelling practice</h2><label for="list">Choose a word list</label><select id="list"></select><div class="stats"><p>Attempted: <span id="attempts">0</span></p><p>Correct: <span id="correct">0</span></p><p>⭐ <span id="stars">0</span></p></div><div class="word"><p id="prompt">Listen to the word!</p><button id="speak">🔊 Read the word</button></div><label for="answer">Type the spelling</label><input id="answer" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Your answer"><button id="check">Check spelling</button><button id="next" class="secondary">Next word →</button><p id="feedback" class="status" aria-live="polite"></p><p class="hint">Words to practise again: <span id="missed" class="missed">None yet</span></p><button id="retry" class="secondary">Practise missed words</button></section>
</main>
<script src="spelling-lists.js"></script>
<script>
let builtins={};
const $=id=>document.getElementById(id);let custom={};try{custom=JSON.parse(localStorage.getItem("spelling-stars-lists")||"{}")}catch{}let current="",attempts=0,correct=0,stars=0,answered=false,missed=[],pool=[],seen=[],nextTimer=null;function cancelNext(){if(nextTimer!==null){clearTimeout(nextTimer);nextTimer=null}}
function all(){return {...builtins,...custom}}
function populate(){let selected=$("list").value;$("list").replaceChildren();Object.keys(all()).forEach(k=>{let o=document.createElement("option");o.value=k;o.textContent=k;$("list").append(o)});if(all()[selected])$("list").value=selected;choose()}
function choose(){cancelNext();pool=[...all()[$("list").value]];seen=[];next()}
function next(){cancelNext();if(!pool.length){current="";$("prompt").textContent="No spelling words loaded";return;}let available=pool.filter(w=>!seen.includes(w));if(!available.length){seen=[];available=pool}current=available[Math.floor(Math.random()*available.length)];seen.push(current);answered=false;$("check").disabled=false;$("answer").value="";$("feedback").textContent="";$("prompt").textContent="🔒 Listen and spell the hidden word";speak();setTimeout(focusAnswer,60)}
function bestBritishVoice(){const voices=speechSynthesis.getVoices();const british=voices.filter(v=>/^en[-_]GB$/i.test(v.lang));const candidates=british.length?british:voices.filter(v=>/^en/i.test(v.lang));const score=v=>{const name=v.name.toLowerCase();return (/natural|neural|premium|enhanced|serena|daniel|kate|siri|google uk|microsoft.*online/.test(name)?10:0)+(v.localService?1:0)};return candidates.sort((a,b)=>score(b)-score(a))[0]||null}
function focusAnswer(){if(!answered&&current){const input=$("answer");input.focus({preventScroll:true});if(document.activeElement===input)input.setSelectionRange(input.value.length,input.value.length)}}
function speak(){if(!current||!("speechSynthesis" in window)){focusAnswer();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current);u.lang="en-GB";u.rate=.85;u.pitch=1;const voice=bestBritishVoice();if(voice)u.voice=voice;u.onend=focusAnswer;u.onerror=focusAnswer;speechSynthesis.speak(u)}
function check(){if(answered)return;let value=$("answer").value.trim();if(!value){$("feedback").textContent="Please type an answer first.";return}answered=true;attempts++;if(value.toLowerCase()===current.toLowerCase()){correct++;stars++;window.SpellingStars?.award(1);$("feedback").textContent="Brilliant! Correct ⭐"}else{$("feedback").textContent="Good try! The correct spelling is: "+current;if(!missed.includes(current))missed.push(current)}$("prompt").textContent=current;$("attempts").textContent=attempts;$("correct").textContent=correct;$("stars").textContent=stars;$("missed").textContent=missed.join(", ")||"None yet";$("check").disabled=true;nextTimer=setTimeout(next,1400)}
$("list").onchange=choose;$("speak").onclick=speak;$("check").onclick=check;$("next").onclick=next;$("answer").onkeydown=e=>{if(e.key==="Enter")check()};$("retry").onclick=()=>{if(!missed.length){$("feedback").textContent="No missed words yet!";return}cancelNext();pool=[...missed];seen=[];next()};
window.addEventListener("spelling-lists-refreshed",e=>{const selected=$("list").value;builtins=e.detail.lists;populate();if(builtins[selected]){$("list").value=selected;choose()}});loadSpellingLists().then(({lists,failures})=>{builtins=lists;populate();if(failures.length)$("feedback").textContent="Some lists could not load. Refresh the page.";if(!Object.keys(lists).length)$("feedback").textContent="Could not load spelling lists. Please refresh."}).catch(()=>{$("feedback").textContent="Could not load lists. Please refresh."});
</script><script src="stars.js?v=services2"></script></body></html>
