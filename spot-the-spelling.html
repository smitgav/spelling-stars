<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Spelling — School is Cool</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f1ff;color:#30244c;font-family:system-ui,sans-serif}header{background:#6852d5;color:white;text-align:center;padding:25px 15px}h1{margin:0;font-size:clamp(1.7rem,5vw,2.5rem)}main{max-width:830px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 5px 22px #26175b1c}a{color:#5434b4}label{display:block;font-weight:700;margin:15px 0 7px}select{width:100%;font:inherit;padding:12px;border:2px solid #d8cdf5;border-radius:12px}button{border:0;border-radius:13px;padding:12px 19px;background:#6852d5;color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:default}.secondary{background:#e9e3ff;color:#4933a7}.hidden{display:none!important}.centre{text-align:center}.stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-weight:750;margin:20px 0}.words{list-style:none;counter-reset:words;padding:0;max-width:470px;margin:18px auto}.words li{counter-increment:words;display:flex;align-items:center;gap:12px;border:2px solid #eee8ff;border-radius:12px;padding:10px 13px;margin:7px 0;min-height:49px;font-size:1.08rem;font-weight:700}.words li::before{content:counter(words) ".";color:#6852d5;min-width:25px}.words li.active{border-color:#e9ad16;background:#fff9e6}.words li.done{background:#f6f6f8}.word-text{flex:1}.result{font-size:1.3rem}.choices{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:17px 0}.choices button{min-width:130px;background:#1e8071}.choices button:nth-child(2){background:#7653cf}.choices button:nth-child(3){background:#b54c8c}.choices button:disabled{opacity:.6}.status{font-weight:700;min-height:25px}dialog{border:0;border-radius:23px;width:min(92vw,500px);padding:24px;box-shadow:0 20px 65px #24144566}dialog::backdrop{background:#241445a8}.results{max-height:43vh;overflow:auto;text-align:left}.results p{border-bottom:1px solid #eee;padding-bottom:9px}button:focus-visible,select:focus-visible{outline:4px solid #fbc341;outline-offset:3px}
</style></head><body><header><h1>🔎 Spot the Correct Spelling</h1><p>Remember the words, spot the right spelling and beat the clock!</p></header><main><p><a href="index.html">← Back to all games</a></p><div class="card"><label for="list">Choose your spelling list</label><select id="list"></select><div class="stats"><span>⏱️ <span id="clock">00:00</span></span><span>⭐ <span id="score">0</span> / 10</span></div><p id="instructions" class="centre">Press Start to see your 10 words. Remember them before you begin!</p><div class="centre"><button id="start">▶ Start 10-word game</button><button id="begin" class="hidden">🧠 I'm ready — start the timer!</button></div><ol id="words" class="words"></ol><section id="questionArea" class="centre hidden"><h2 id="prompt">Which spelling is correct?</h2><div id="choices" class="choices"></div><p id="feedback" class="status" aria-live="polite"></p><button id="next" class="secondary hidden">Next word →</button></section></div></main>
<dialog id="resultsDialog" aria-labelledby="resultsTitle"><div class="centre"><div style="font-size:3rem">🏆 ⭐</div><h2 id="resultsTitle">Your spelling results!</h2><p id="finalScore"></p><p id="finalTime"></p><div id="results" class="results"></div><p><button id="again">🔁 Play another 10 words</button></p><a href="index.html">Back to all games</a></div></dialog>
<script src="spelling-lists.js"></script><script src="stars.js?v=timeline3"></script><script>
const $=id=>document.getElementById(id);let lists={},round=[],results=[],index=0,started=0,ticker=null,phase="ready";
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function format(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function stopClock(){if(ticker!==null)clearInterval(ticker);ticker=null}
function renderWords(hideCurrent=false){const el=$("words");el.replaceChildren();round.forEach((w,i)=>{const li=document.createElement("li");if(i===index&&phase==="playing")li.classList.add("active");if(i<results.length)li.classList.add("done");const word=document.createElement("span");word.className="word-text";word.textContent=hideCurrent&&i===index?"❓ Hidden word":w;li.append(word);if(i<results.length){const badge=document.createElement("span");badge.className="result";badge.textContent=results[i].correct?"✅":"❌";li.append(badge)}el.append(li)})}
function wrongSpellings(word){const base=word.toLowerCase();const out=new Set();const vowels="aeiou";let attempts=0;while(out.size<2&&attempts++<150){let chars=[...base];const positions=chars.map((c,i)=>/[a-z]/.test(c)?i:-1).filter(i=>i>=0);if(!positions.length)break;const i=positions[Math.floor(Math.random()*positions.length)];const kind=attempts%4;if(kind===0&&chars.length>4){chars.splice(i,1)}else if(kind===1){chars.splice(i,0,chars[i])}else if(kind===2&&i<chars.length-1&&/[a-z]/.test(chars[i+1])&&chars[i]!==chars[i+1]){[chars[i],chars[i+1]]=[chars[i+1],chars[i]]}else{const pool=vowels.includes(chars[i])?vowels:"bcdfghjklmnpqrstvwxyz";chars[i]=pool[(pool.indexOf(chars[i])+1+attempts)%pool.length]}const wrong=chars.join("");if(wrong!==base&&!out.has(wrong))out.add(wrong)}let n=1;while(out.size<2)out.add(base+"x".repeat(n++));return [...out].slice(0,2)}
function prepare(){stopClock();phase="preview";const all=[...new Set((lists[$("list").value]||[]).filter(w=>typeof w==="string"&&w.trim()).map(w=>w.trim().toLowerCase()))];if(all.length<10){$("instructions").textContent="This list needs at least 10 different words to play.";return}round=shuffle(all).slice(0,10);results=[];index=0;$("score").textContent="0";$("clock").textContent="00:00";$("start").classList.add("hidden");$("begin").classList.remove("hidden");$("questionArea").classList.add("hidden");$("instructions").textContent="Memorise these 10 words. When you're ready, start the timer!";renderWords()}
function begin(){phase="playing";started=Date.now();$("begin").classList.add("hidden");$("questionArea").classList.remove("hidden");$("instructions").textContent="Pick the correct spelling for the hidden word.";ticker=setInterval(()=>$("clock").textContent=format(Date.now()-started),200);showQuestion()}
function showQuestion(){phase="playing";renderWords(true);$("prompt").textContent="Word "+(index+1)+" of 10 — which spelling is correct?";$("feedback").textContent="";$("next").classList.add("hidden");const options=shuffle([round[index],...wrongSpellings(round[index])]);const area=$("choices");area.replaceChildren();options.forEach(w=>{const b=document.createElement("button");b.textContent=w;b.onclick=()=>choose(w);area.append(b)})}
function choose(value){if(phase!=="playing")return;phase="answered";const word=round[index],correct=value===word;results.push({word,answer:value,correct});if(correct)window.SpellingStars?.award(1);$("score").textContent=results.filter(r=>r.correct).length;renderWords(false);$("choices").querySelectorAll("button").forEach(b=>{b.disabled=true;if(b.textContent===word)b.style.background="#18845e";else if(b.textContent===value)b.style.background="#c73549"});$("feedback").textContent=correct?"🎉 Correct! "+word+" ⭐":"❌ Not quite! The correct spelling is "+word;$("next").textContent=index===9?"🏆 See my results":"Next word →";$("next").classList.remove("hidden");if(index===9){stopClock();$("clock").textContent=format(Date.now()-started)}}
function advance(){index++;if(index===10)showResults();else showQuestion()}
function showResults(){phase="finished";stopClock();$("finalScore").textContent="⭐ "+results.filter(r=>r.correct).length+" out of 10 correct!";$("finalTime").textContent="⏱️ Your time: "+$("clock").textContent;const el=$("results");el.replaceChildren();results.forEach((r,i)=>{const p=document.createElement("p");p.textContent=(i+1)+". "+(r.correct?"✅ ":"❌ ")+r.word+(r.correct?"":" — You chose: "+r.answer);el.append(p)});$("resultsDialog").showModal()}
function populate(){const old=$("list").value;$("list").replaceChildren();Object.keys(lists).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;$("list").append(o)});if(lists[old])$("list").value=old}
$("start").onclick=prepare;$("begin").onclick=begin;$("next").onclick=advance;$("again").onclick=()=>{$("resultsDialog").close();prepare()};$("list").onchange=()=>{stopClock();phase="ready";$("words").replaceChildren();$("start").classList.remove("hidden");$("begin").classList.add("hidden");$("questionArea").classList.add("hidden");$("instructions").textContent="Press Start to see your 10 words.";$("clock").textContent="00:00";$("score").textContent="0"};window.addEventListener("pagehide",stopClock);window.addEventListener("spelling-lists-refreshed",e=>{lists=e.detail.lists;populate()});loadSpellingLists().then(r=>{lists=r.lists;populate()});
</script></body></html>
